name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases come from <Version> in Tether.csproj: when a push to main carries a version
          # that has no release yet, this build becomes that release. Pushing a v* tag also works.
          [xml]$proj = Get-Content src/Tether/Tether.csproj
          $projVersion = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $release = "false"
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v'); $release = "true"
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -eq "main") {
            gh release view "v$projVersion" --repo "${{ github.repository }}" 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $v = $projVersion; $release = "true" }
            else { $v = "$projVersion-ci.${{ github.run_number }}" }
          } else {
            $v = "$projVersion-ci.${{ github.run_number }}"
          }
          $global:LASTEXITCODE = 0
          $core = ($v -split '-')[0]
          "version=$v" >> $env:GITHUB_OUTPUT
          "core=$core" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=Version::Building Tether $v (release: $release)"

      - name: Publish single-file exe
        run: >
          dotnet publish src/Tether/Tether.csproj -c Release -r win-x64
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.core }}.0
          -p:FileVersion=${{ steps.ver.outputs.core }}.0
          -o publish

      - name: Smoke test (open every window)
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process publish/Tether.exe -ArgumentList "--selftest", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Self-test timed out" }
          $level = if ($p.ExitCode -eq 0) { "notice" } else { "error" }
          if (Test-Path $report) {
            $text = (Get-Content $report) -join '%0A'
            Write-Host "::$level title=Self-test::$text"
          } else { Write-Host "::$level title=Self-test::No report written (exit $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Tether.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Tether.exe" | Out-File -Encoding ascii -NoNewline publish/Tether.exe.sha256
          Get-Content publish/Tether.exe.sha256
          "{0:N1} MB" -f ((Get-Item publish/Tether.exe).Length / 1MB)

      - uses: actions/upload-artifact@v6
        with:
          name: Tether-${{ steps.ver.outputs.version }}
          path: |
            publish/Tether.exe
            publish/Tether.exe.sha256

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tether ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            publish/Tether.exe
            publish/Tether.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
